# Cuts a release when a vX.Y.Z tag is pushed.
#
# Five artifacts are published, plus a checksum for each:
#   1. kvault-X.Y.Z.tar.gz         source bundle (pinned by the release PKGBUILD)
#   2. kvault-X.Y.Z-*.pkg.tar.zst  Arch package, built with the release PKGBUILD
#   3. kvault.flatpak              single-file Flatpak bundle
#   4. kvault_*.deb                 Debian package
#   5. kvault-*.rpm                 RPM package
#
# GitHub attaches its own "Source code (zip/tar.gz)" links to every release,
# but those are generated on demand and are not byte-stable, so they cannot be
# pinned by digest. The tarball built here is a real uploaded asset, which is
# what makes a sha256sums entry in the PKGBUILD meaningful.
#
# The website is deployed by pages.yml, which triggers on the same tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    name: Build, test and check versions
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja git \
            qt6-base qt6-declarative qt6-svg \
            kirigami kirigami-addons ki18n kcoreaddons kdbusaddons \
            kstatusnotifieritem qqc2-desktop-style \
            qtkeychain-qt6 openssl argon2 \
            appstream desktop-file-utils

      - uses: actions/checkout@v7

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=ON
          cmake --build build
          ctest --test-dir build --output-on-failure --no-tests=error

      - name: Check the tag agrees with the project metadata
        # A release whose metadata disagrees with its tag causes confusing
        # breakage in release packaging, so fail before anything is published.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project=$(grep -oP 'project\(kvault VERSION \K[0-9.]+' CMakeLists.txt)
          echo "tag=$tag project=$project"
          if [ "$tag" != "$project" ]; then
            echo "::error::Tag $tag does not match CMakeLists.txt version $project"
            exit 1
          fi
          if ! grep -q "version=\"$tag\"" data/io.github.timpalpant.kvault.metainfo.xml; then
            echo "::error::No <release version=\"$tag\"> entry in the AppStream metainfo"
            exit 1
          fi
          appstreamcli validate --no-net data/io.github.timpalpant.kvault.metainfo.xml

  source:
    name: Source tarball
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create the tarball
        run: |
          name="kvault-${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="$name/" \
            -o "$name.tar.gz" "$GITHUB_REF_NAME"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      # The release PKGBUILD pins this tarball by digest, so the value has to travel
      # from here into the PKGBUILD. A stale digest left over from an earlier
      # version is a hard error: it would either break the build or, worse,
      # describe a file nobody is actually shipping.
      - name: Report the release PKGBUILD checksum
        run: |
          name="kvault-${GITHUB_REF_NAME#v}"
          digest=$(cut -d' ' -f1 < "$name.tar.gz.sha256")
          recorded=$(sed -n "s/^sha256sums=('\(.*\)')/\1/p" packaging/arch/kvault/PKGBUILD)

          if [ "$recorded" != "$digest" ] && [ "$recorded" != "REPLACE_WITH_RELEASE_SHA256" ]; then
            echo "::error::packaging/arch/kvault/PKGBUILD pins $recorded, but this tarball is $digest"
            exit 1
          fi

          {
            echo "### Release PKGBUILD"
            echo
            echo "Before publishing the draft, set this in \`packaging/arch/kvault/PKGBUILD\`:"
            echo
            echo '```sh'
            echo "sha256sums=('$digest')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$recorded" = "REPLACE_WITH_RELEASE_SHA256" ]; then
            echo "::warning::PKGBUILD still holds the placeholder checksum; set it to $digest"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: source-tarball
          path: |
            kvault-*.tar.gz
            kvault-*.tar.gz.sha256
          if-no-files-found: error

  archpkg:
    name: Arch package (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git pacman-contrib sudo

      - uses: actions/checkout@v7

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Uses the release PKGBUILD with its source repointed at this checkout.
      - name: Build the package
        run: ./packaging/build-arch-package.sh --outdir "$PWD/dist"

      - uses: actions/upload-artifact@v7
        with:
          name: arch-package-${{ matrix.arch }}
          path: |
            dist/*.pkg.tar.zst
            dist/*.pkg.tar.zst.sha256
          if-no-files-found: error

  deb:
    name: Debian package (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake ninja-build g++ git dpkg-dev file gettext \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-tools-dev \
            libkf6coreaddons-dev libkf6i18n-dev libkf6dbusaddons-dev \
            libkf6statusnotifieritem-dev libkirigami-dev kirigami-addons-dev \
            qtkeychain-qt6-dev libssl-dev libargon2-dev

      - uses: actions/checkout@v7

      - name: Build the package
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=OFF
          cmake --build build
          cpack --config build/CPackConfig.cmake -G DEB -B "$PWD/dist"
          for package in dist/*.deb; do sha256sum "$package" > "$package.sha256"; done

      - uses: actions/upload-artifact@v7
        with:
          name: deb-package-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error

  rpm:
    name: RPM package (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - name: Install dependencies
        run: |
          dnf -y install \
            cmake ninja-build gcc-c++ git rpm-build gettext \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel \
            qt6-qttools-devel \
            kf6-kcoreaddons-devel kf6-ki18n-devel kf6-kdbusaddons-devel \
            kf6-kstatusnotifieritem-devel kf6-kirigami-devel \
            kf6-kirigami-addons-devel qtkeychain-qt6-devel openssl-devel \
            libargon2-devel
          dnf clean all

      - uses: actions/checkout@v7

      - name: Build the package
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=OFF
          cmake --build build
          cpack --config build/CPackConfig.cmake -G RPM -B "$PWD/dist"
          for package in dist/*.rpm; do sha256sum "$package" > "$package.sha256"; done

      - uses: actions/upload-artifact@v7
        with:
          name: rpm-package-${{ matrix.arch }}
          path: |
            dist/*.rpm
            dist/*.rpm.sha256
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user \
            kde-runtime https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install the KDE runtime
        run: |
          flatpak install --user --noninteractive kde-runtime \
            org.kde.Platform//6.9 org.kde.Sdk//6.9

      - name: Build the bundle
        # The CI manifest builds this checkout, which at a tag is the tagged
        # source. The tagged release manifest pins the tag instead.
        run: |
          # The archive download is served by a selected public KDE mirror;
          # retry a transient mirror timeout before treating it as a failure.
          for attempt in 1 2 3; do
            if flatpak-builder --user --disable-rofiles-fuse --force-clean \
              --repo=flatpak-repo build-flatpak \
              packaging/flatpak/io.github.timpalpant.kvault.ci.yml; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            echo "Flatpak build attempt $attempt failed; retrying in 15 seconds."
            sleep 15
          done
          flatpak build-bundle flatpak-repo kvault-${{ matrix.arch }}.flatpak \
            io.github.timpalpant.kvault
          sha256sum kvault-${{ matrix.arch }}.flatpak > kvault-${{ matrix.arch }}.flatpak.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle-${{ matrix.arch }}
          path: |
            kvault-${{ matrix.arch }}.flatpak
            kvault-${{ matrix.arch }}.flatpak.sha256
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [source, archpkg, deb, rpm, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: ls -la artifacts

      - uses: softprops/action-gh-release@v3
        with:
          # Drafted rather than published: the release PKGBUILD checksum must
          # be recorded before the release is announced.
          draft: true
          generate_release_notes: true
          files: artifacts/*
          body: |
            ### Install

            Native packages are available for both x86_64/amd64 and
            aarch64/arm64. Download the asset matching your machine before
            using the commands below.

            **Arch Linux** — install the attached package directly:

            ```sh
            sudo pacman -U kvault-*.pkg.tar.zst
            ```

            **Debian / Ubuntu** — download the attached `.deb`, then:

            ```sh
            sudo apt install ./kvault_*.deb
            ```

            **Fedora / RPM-based** — download the attached `.rpm`, then:

            ```sh
            sudo dnf install ./kvault-*.rpm
            ```

            **Flatpak** — download the matching `kvault-<architecture>.flatpak`, then:

            ```sh
            flatpak install --user kvault-<architecture>.flatpak
            flatpak run io.github.timpalpant.kvault
            ```

            **From source** — `kvault-*.tar.gz` is the release tarball used by
            the release PKGBUILD. A `.sha256` accompanies every artifact.

            Your master password never leaves the device: it is used locally to
            derive the keys that decrypt the vault, and only a one-way hash of
            it is sent to the server.
